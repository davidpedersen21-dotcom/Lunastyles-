<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:#faf7f2;color:#221a0f;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}

:root{
  --sand:#faf7f2;--cream:#f4ede0;--warm:#e8d8c0;
  --rust:#b84a18;--rust-dk:#8f3610;--rust-lt:#fdf0ea;
  --gold:#c88a1a;--gold-lt:#fdf6e3;
  --teal:#1e7a7a;--teal-lt:#e6f4f4;
  --plum:#6b3461;--plum-lt:#f5eaf4;
  --saffron:#d4880a;
  --indigo:#354880;--indigo-lt:#eaecf8;
  --bark:#2a1a0a;--text:#221a0f;--muted:#7a6045;
  --r:14px;
  --sh:0 2px 20px rgba(42,26,10,.08);
  --sh-lg:0 8px 40px rgba(42,26,10,.14);
  --sh-xl:0 16px 60px rgba(42,26,10,.20);
}

/* ── KEYFRAMES ── */
@keyframes flow{0% {background-position:0% 50%}50% {background-position:100% 50%}100% {background-position:0% 50%}}
@keyframes ticker{0% {transform:translateX(0)}100% {transform:translateX(-50%)}}
@keyframes pulse{0%,100% {opacity:1;transform:scale(1)}50% {opacity:.35;transform:scale(.65)}}
@keyframes float{0%,100% {transform:translateY(0)}50% {transform:translateY(-18px)}}
@keyframes shimmer{0% {background-position:200% 0}100% {background-position:-200% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100% {box-shadow:0 0 0 0 rgba(184,74,24,.4)}50% {box-shadow:0 0 0 10px rgba(184,74,24,0)}}
@keyframes borderSpin{0% {background-position:0% 50%}50% {background-position:100% 50%}100% {background-position:0% 50%}}
@keyframes orb1{0%,100% {transform:translate(0,0) scale(1)}33% {transform:translate(30px,-20px) scale(1.1)}66% {transform:translate(-20px,15px) scale(.9)}}
@keyframes orb2{0%,100% {transform:translate(0,0) scale(1)}33% {transform:translate(-25px,20px) scale(.9)}66% {transform:translate(20px,-15px) scale(1.1)}}

/* ── KANTHA BORDER ── */
.kantha{height:5px;background:linear-gradient(90deg,var(--rust),var(--gold),var(--teal),var(--plum),var(--indigo),var(--saffron),var(--rust));background-size:400% 100%;animation:flow 7s ease infinite}

/* ── MARQUEE ── */
.marquee-bar{background:var(--bark);overflow:hidden;white-space:nowrap;padding:9px 0}
.marquee-track{display:inline-flex;animation:ticker 30s linear infinite}
.marquee-track:hover{animation-play-state:paused}
.marquee-item{display:inline-flex;align-items:center;gap:8px;padding:0 26px;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.78)}
.marquee-dot{color:var(--gold);font-size:1rem}
.marquee-item a{color:var(--gold);text-decoration:underline;text-underline-offset:2px}

/* ── COUNTDOWN ── */
#cd-bar{background:linear-gradient(90deg,#1a0a02 0%,#2a160a 100%);color:#fff;padding:9px 16px;display:flex;align-items:center;justify-content:center;gap:12px;position:relative;transition:background .5s;flex-wrap:wrap}
#cd-bar.live{background:linear-gradient(90deg,var(--rust),var(--plum))}
.cd-dot{width:7px;height:7px;border-radius:50%;background:#ff5252;flex-shrink:0;animation:pulse 1.4s ease-in-out infinite}
.cd-text{font-size:.8rem;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.cd-cta{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;padding:4px 13px;border-radius:50px;font-size:.75rem;font-weight:600;cursor:pointer;transition:background .2s}
.cd-cta:hover{background:rgba(255,255,255,.28)}
.cd-close{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.45);font-size:1rem;cursor:pointer;line-height:1}
.cd-close:hover{color:#fff}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:200;background:rgba(250,247,242,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--warm)}
.hdr{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:66px;padding:0 clamp(16px,4vw,48px)}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:40px;height:40px;object-fit:contain;transition:transform .4s ease}
.logo:hover img{transform:rotate(25deg) scale(1.1)}
.logo-name{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:700;color:var(--bark);letter-spacing:-.01em}
.logo-name span{color:var(--rust)}
nav.desk{display:flex;align-items:center;gap:clamp(10px,2vw,24px)}
nav.desk a{font-size:.84rem;font-weight:500;color:var(--muted);position:relative;transition:color .2s}
nav.desk a::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:1.5px;background:var(--rust);transform:scaleX(0);transition:transform .22s;border-radius:2px;transform-origin:left}
nav.desk a:hover{color:var(--rust)}
nav.desk a:hover::after{transform:scaleX(1)}
.nav-cta{background:var(--rust);color:#fff!important;padding:8px 18px;border-radius:50px;transition:background .2s,transform .18s!important}
.nav-cta:hover{background:var(--rust-dk)!important;transform:translateY(-1px)!important}
.nav-cta::after{display:none!important}
.burger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none}
.burger span{width:22px;height:2px;background:var(--bark);border-radius:2px;transition:.28s;display:block}
.mob-nav{display:none;flex-direction:column;background:#fff;border-top:1px solid var(--warm);position:absolute;top:66px;left:0;right:0;box-shadow:var(--sh-lg)}
.mob-nav.open{display:flex}
.mob-nav a{padding:13px 24px;font-size:.95rem;font-weight:500;color:var(--text);border-bottom:1px solid var(--cream)}
.mob-nav a:last-child{color:var(--rust);font-weight:700;border:none}
@media(max-width:680px){nav.desk{display:none}.burger{display:flex}}

/* ── HERO ── */
.hero{padding:clamp(52px,8vw,100px) clamp(16px,4vw,48px);position:relative;overflow:hidden;background:linear-gradient(145deg,#fdf5eb 0%,#f8ead6 35%,#eef7f5 70%,#f5eaf7 100%)}
.hero-orb{position:absolute;border-radius:50%;filter:blur(72px);pointer-events:none}
.orb-a{width:380px;height:380px;background:radial-gradient(circle,rgba(212,136,10,.28),transparent);top:-80px;right:-60px;animation:orb1 10s ease-in-out infinite}
.orb-b{width:320px;height:320px;background:radial-gradient(circle,rgba(30,122,122,.22),transparent);bottom:-60px;left:-40px;animation:orb2 12s ease-in-out infinite}
.orb-c{width:260px;height:260px;background:radial-gradient(circle,rgba(107,52,97,.18),transparent);bottom:10%;right:25%;animation:float 9s ease-in-out infinite}
.hero-inner{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,5vw,72px);align-items:center;position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(184,74,24,.1);color:var(--rust);font-size:.73rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 13px;border-radius:50px;margin-bottom:18px;border:1px solid rgba(184,74,24,.18)}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,5vw,3.4rem);font-weight:700;line-height:1.1;color:var(--bark);margin-bottom:18px}
.hero h1 em{font-style:italic;color:var(--rust)}
.hero p{color:var(--muted);font-size:clamp(.9rem,1.8vw,1.05rem);max-width:460px;margin-bottom:30px;line-height:1.8}
.hero-btns{display:flex;flex-wrap:wrap;gap:10px}
.hero-visual{display:flex;flex-direction:column;gap:12px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px}
.stat{background:rgba(255,255,255,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.95);border-radius:12px;padding:16px 10px;text-align:center;transition:transform .22s,box-shadow .22s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.stat-n{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:700;color:var(--rust)}
.stat-l{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
.plat-cards{display:flex;flex-direction:column;gap:8px}
.plat-card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-radius:11px;padding:11px 14px;transition:all .22s;position:relative;overflow:hidden}
.plat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.plat-card.et::before{background:var(--rust)}
.plat-card.wn::before{background:var(--indigo)}
.plat-card.ig::before{background:linear-gradient(180deg,var(--gold),var(--plum))}
.plat-card:hover{background:#fff;box-shadow:var(--sh-lg);transform:translateX(5px)}
.plat-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.plat-ico.et{background:#F56400}.plat-ico.ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}.plat-ico.wn{background:var(--indigo)}
.plat-name{font-weight:600;font-size:.84rem;color:var(--bark)}
.plat-sub{font-size:.71rem;color:var(--muted)}
.plat-arr{margin-left:auto;color:var(--muted);font-size:.85rem;transition:transform .2s}
.plat-card:hover .plat-arr{transform:translateX(4px)}
@media(max-width:780px){.hero-inner{grid-template-columns:1fr}.hero-visual{order:-1}}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:12px 22px;border-radius:50px;font-weight:600;font-size:.88rem;transition:all .22s;cursor:pointer;border:none;font-family:inherit;letter-spacing:.01em}
.btn-rust{background:var(--rust);color:#fff;box-shadow:0 4px 16px rgba(184,74,24,.25)}
.btn-rust:hover{background:var(--rust-dk);transform:translateY(-2px);box-shadow:0 8px 24px rgba(184,74,24,.35)}
.btn-teal{background:var(--teal);color:#fff;box-shadow:0 4px 14px rgba(30,122,122,.2)}
.btn-teal:hover{background:#165e5e;transform:translateY(-2px);box-shadow:0 8px 22px rgba(30,122,122,.3)}
.btn-outline{background:transparent;color:var(--rust);border:2px solid var(--rust)}
.btn-outline:hover{background:var(--rust);color:#fff;transform:translateY(-1px)}
.btn-plum{background:var(--plum);color:#fff}
.btn-plum:hover{background:#541a4a;transform:translateY(-2px);box-shadow:0 8px 22px rgba(107,52,97,.3)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:#a06e0a;transform:translateY(-2px)}

/* ── STRIPE ── */
.stripe{height:4px;background:linear-gradient(90deg,var(--teal),var(--plum),var(--gold),var(--rust),var(--indigo))}

/* ── SECTION BASE ── */
section{padding:clamp(52px,7vw,96px) clamp(16px,4vw,48px)}
.inner{max-width:1240px;margin:0 auto}
.s-tag{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px;display:block}
.s-tag.rust{color:var(--rust)}.s-tag.teal{color:var(--teal)}.s-tag.plum{color:var(--plum)}.s-tag.gold{color:var(--gold)}.s-tag.saffron{color:var(--saffron)}
.s-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.7rem,4vw,2.6rem);font-weight:700;color:var(--bark);margin-bottom:12px;line-height:1.18}
.s-sub{color:var(--muted);font-size:.98rem;max-width:540px;margin-bottom:34px;line-height:1.78}

/* ── SHOP / ETSY EMBEDS ── */
#shop{background:var(--sand)}
