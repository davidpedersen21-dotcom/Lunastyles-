<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Luna Styles — Moth Animation</title>
<style>
  :root{
    --orange:#f2641a;
    --red:#d8322b;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow:hidden;
    background:#000;
  }

  /* ---- preview backdrop (production is transparent) ---- */
  .viewport{
    position:fixed; inset:0;
    display:grid; place-items:center;
    transition: background-color .4s ease;
  }
  .viewport[data-bg="dark"]{ background:#15110f; }
  .viewport[data-bg="light"]{ background:#f4f1ea; }
  .viewport[data-bg="transparent"]{
    background-color:#cfcabf;
    background-image:
      linear-gradient(45deg,#bdb8ac 25%,transparent 25%,transparent 75%,#bdb8ac 75%),
      linear-gradient(45deg,#bdb8ac 25%,transparent 25%,transparent 75%,#bdb8ac 75%);
    background-size:36px 36px;
    background-position:0 0,18px 18px;
  }

  /* ---- scaled stage: fixed 1024 design space ---- */
  .scene{
    position:relative;
    width:1024px; height:1024px;
    transform: scale(var(--s,0.8));
    transform-origin:center center;
    will-change: transform;
  }
  .layer{ position:absolute; inset:0; width:1024px; height:1024px; }
  .layer img{ position:absolute; inset:0; width:1024px; height:1024px; display:block; user-select:none; -webkit-user-drag:none; }

  /* frame (arcs + stars + lettering) */
  .frame{
    opacity:1;
    transform: scale(1);
    transform-origin:center center;
    will-change: opacity, transform;
  }

  /* moth group (flies as a whole) */
  .moth{
    transform: translate(0px,0px) rotate(0deg) scale(1);
    transform-origin:512px 480px;
    will-change: transform, filter;
  }
  .wing{ will-change: transform; }
  .wing.left{  transform-origin: 44.43% 42%; }
  .wing.right{ transform-origin: 55.57% 42%; }
  /* dim full-moth underlay fills the area a folding wing reveals with the wing's own colours */
  .underlay{ z-index:0; filter: brightness(0.42) saturate(0.92); }
  /* body drawn above wings so thorax overlaps wing roots cleanly */
  .body{ z-index:3; }
  .wing{ z-index:1; }

  /* radial glow bloom */
  .glow{
    position:absolute; left:512px; top:470px;
    width:900px; height:900px; margin:-450px 0 0 -450px;
    border-radius:50%;
    background: radial-gradient(circle,
      rgba(242,100,26,.55) 0%,
      rgba(216,50,43,.35) 32%,
      rgba(242,100,26,.10) 55%,
      rgba(242,100,26,0) 72%);
    opacity:0; transform:scale(.5);
    pointer-events:none; mix-blend-mode:screen;
    will-change: opacity, transform;
  }

  /* closing ring (the circle locking in) */
  .lockring{
    position:absolute; left:512px; top:512px;
    width:760px; height:760px; margin:-380px 0 0 -380px;
    border-radius:50%;
    border:3px solid var(--orange);
    opacity:0; transform:scale(1.25);
    pointer-events:none;
    box-shadow:0 0 0 0 rgba(242,100,26,.0);
    will-change: opacity, transform;
  }

  /* ---- controls (preview only — easy to strip) ---- */
  .controls{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    display:flex; align-items:center; gap:14px;
    padding:9px 12px;
    background:rgba(20,17,15,.62); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.10);
    border-radius:999px;
    z-index:50;
    color:#e9e4da;
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  }
  .btn{
    appearance:none; border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.05); color:#f3efe7;
    font:inherit; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 14px; border-radius:999px; cursor:pointer;
    transition: background .18s ease, border-color .18s ease, transform .1s ease;
  }
  .btn:hover{ background:rgba(242,100,26,.20); border-color:rgba(242,100,26,.55); }
  .btn:active{ transform:translateY(1px); }
  .btn.replay{ background:var(--orange); border-color:var(--orange); color:#1a120c; font-weight:600; }
  .btn.replay:hover{ filter:brightness(1.07); }
  .seg{ display:flex; gap:4px; }
  .seg .btn{ padding:6px 10px; font-size:10px; }
  .seg .btn[aria-pressed="true"]{ background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.4); color:#fff; }
  .lbl{ opacity:.55; font-size:10px; }
</style>
</head>
<body>
  <div class="viewport" data-bg="dark">
    <div class="scene" id="scene">
      <div class="layer frame" id="frame">
        <img src="assets/frame.png" alt="Luna Styles frame" />
      </div>

      <div class="glow" id="glow"></div>
      <div class="lockring" id="lockring"></div>

      <div class="layer moth" id="moth">
        <img class="underlay"   id="underlay" src="assets/moth_underlay.png"  alt="" />
        <img class="wing left"  id="wingL" src="assets/moth_left.png"  alt="" />
        <img class="wing right" id="wingR" src="assets/moth_right.png" alt="" />
        <img class="body"       id="body"  src="assets/moth_body.png"  alt="moth" />
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn replay" id="replay">↻ Replay</button>
    <span class="lbl">bg</span>
    <div class="seg" id="bgseg">
      <button class="btn" data-bg="transparent">Transparent</button>
      <button class="btn" data-bg="dark" aria-pressed="true">Dark</button>
      <button class="btn" data-bg="light">Light</button>
    </div>
  </div>

<script>
(function(){
  "use strict";
  const scene   = document.getElementById('scene');
  const frame   = document.getElementById('frame');
  const moth    = document.getElementById('moth');
  const wingL   = document.getElementById('wingL');
  const wingR   = document.getElementById('wingR');
  const glow    = document.getElementById('glow');
  const lockring= document.getElementById('lockring');

  /* ---------- responsive scaling of the fixed 1024 stage ---------- */
  function fit(){
    const m = Math.min(window.innerWidth, window.innerHeight);
    scene.style.setProperty('--s', (m/1024 * 0.94).toFixed(4));
  }
  window.addEventListener('resize', fit); fit();

  /* ---------- math helpers ---------- */
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const lerp=(a,b,t)=>a+(b-a)*t;
  const smooth=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };
  const smoothRange=(t,a,b)=> smooth((t-a)/(b-a));
  function catmull(p0,p1,p2,p3,t){
    const t2=t*t, t3=t2*t;
    return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);
  }

  /* ---------- flight path waypoints (design px, relative to home) ---------- */
  // each: [time, x, y, scale]
  const WP = [
    [0.00,    0,    0, 1.00],
    [1.80,    0,  -30, 1.04],
    [2.40,    0,  -72, 1.06],
    [3.10, -300, -150, 0.94],
    [3.80,  -60,   34, 1.00],
    [4.60,  300, -160, 0.92],
    [5.30,  322, -140, 0.93],
    [6.00,  120, -224, 0.96],
    [6.80,  -40,  -42, 1.00],
    [7.40,    0,    0, 1.00]
  ];
  const FLY_END = WP[WP.length-1][0];

  function sampleField(t, idx){ // interpolate WP column idx (1=x,2=y,3=scale) at time t
    if(t<=WP[0][0]) return WP[0][idx];
    if(t>=WP[WP.length-1][0]) return WP[WP.length-1][idx];
    let i=0; while(i<WP.length-1 && !(t>=WP[i][0] && t<=WP[i+1][0])) i++;
    const a=WP[i], b=WP[i+1];
    const local=(t-a[0])/(b[0]-a[0]);
    const p0=WP[Math.max(0,i-1)][idx], p1=a[idx], p2=b[idx], p3=WP[Math.min(WP.length-1,i+2)][idx];
    return catmull(p0,p1,p2,p3, clamp(local,0,1));
  }
  const posX=t=>sampleField(t,1), posY=t=>sampleField(t,2), posS=t=>sampleField(t,3);

  /* ---------- timeline constants ---------- */
  const T = {
    settle: 0.6,
    wake:   1.8,   // flapping in place builds
    free:   2.4,   // breaks free / frame fades
    flyEnd: FLY_END, // 7.40 home
    lock:   8.45,  // frame fully closed/locked
    pulse:  9.55   // glow bloom done
  };

  /* flap frequency (flaps per second) over time */
  function flapFreq(t){
    if(t < T.settle) return 0.7;
    if(t < T.wake)   return lerp(1.1, 3.6, smoothRange(t,T.settle,T.wake));
    if(t < T.free)   return 4.6;
    if(t < T.flyEnd){
      // slower during the hover (~4.6–5.3)
      const hover = (t>4.55 && t<5.45) ? 1 : 0;
      return hover ? 2.6 : 4.2;
    }
    if(t < T.lock)   return lerp(3.4, 1.1, smoothRange(t,T.flyEnd,T.lock));
    return 0.9; // pulse + rest baseline (idle bursts added separately)
  }

  /* ---------- state ---------- */
  let start=null, raf=null, finished=false, paused=false;
  let flapPhase=0, last=0;
  let idleNext=0;       // next idle-shimmer time (after rest)
  let idleBurst=0;      // remaining seconds of an idle flap burst

  function reset(){
    cancelAnimationFrame(raf);
    paused=false;
    start=null; last=0; flapPhase=0; finished=false; idleBurst=0; idleNext=0;
    raf=requestAnimationFrame(loop);
  }

  // verification hooks (harmless in production)
  window.seekTo=function(sec){ start=performance.now()-sec*1000; last=performance.now(); };
  window.renderAt=function(sec){ paused=true; cancelAnimationFrame(raf); start=performance.now()-sec*1000; last=performance.now()-16; loop(performance.now()); };

  function loop(now){
    if(start===null){ start=now; last=now; }
    let t=(now-start)/1000;
    const dt=Math.min(0.05,(now-last)/1000); last=now;

    // ----- flapping (integrate phase) -----
    let freq=flapFreq(t);
    const resting = t>=T.pulse;
    if(resting){
      // occasional shimmer flaps at rest
      if(idleNext===0){ idleNext = t + 3.8; }
      if(idleBurst>0){ idleBurst-=dt; freq=2.4; }
      else if(t>=idleNext){ idleBurst=0.62; idleNext = t + 3.6 + Math.random()*2.2; }
      else { freq=0; }
    }
    flapPhase += dt*2*Math.PI*freq;
    // fold depth: deep while airborne, shallow shimmer at rest
    let foldDepth=0.72;
    if(t>=T.flyEnd) foldDepth = lerp(0.72, 0.24, smoothRange(t, T.flyEnd, T.pulse));
    if(resting) foldDepth=0.24;
    const wave=0.5-0.5*Math.cos(flapPhase);          // 0..1
    const flap = 1 - foldDepth*wave;
    const wingSy = 1 + (0.06*foldDepth)*wave;
    const wingRot = (5.2*foldDepth)*wave;             // deg, wings lift at fold

    wingL.style.transform = `rotate(${ wingRot}deg) scaleX(${flap}) scaleY(${wingSy})`;
    wingR.style.transform = `rotate(${-wingRot}deg) scaleX(${flap}) scaleY(${wingSy})`;

    // ----- moth flight transform -----
    const ft = clamp(t, 0, T.flyEnd);
    let mx=posX(ft), my=posY(ft), ms=posS(ft);
    // banking from horizontal velocity (flight only; body itself never bobs/sways)
    const h=0.04;
    const vx=(posX(clamp(ft+h,0,T.flyEnd))-posX(clamp(ft-h,0,T.flyEnd)))/(2*h);
    const bank = clamp(vx*0.018, -15, 15);
    moth.style.transform = `translate(${mx}px, ${my}px) rotate(${bank}deg) scale(${ms})`;

    // moth glow halo during pulse (drop-shadow on the whole moth)
    let mothGlow=0;
    if(t>=T.lock && t<T.pulse){
      const g=smoothRange(t,T.lock,T.pulse);
      mothGlow = Math.sin(g*Math.PI) * 26;
    }
    moth.style.filter = mothGlow>0.3 ? `drop-shadow(0 0 ${mothGlow}px rgba(242,100,26,.9))` : 'none';

    // ----- frame: visible -> fades out on break-free -> closes back in on lock -----
    let fOp, fSc;
    if(t < T.free-0.2){ fOp=1; fSc=1; }
    else if(t < T.free+0.5){               // fade/scale out
      const k=smoothRange(t, T.free-0.2, T.free+0.5);
      fOp=1-k; fSc=1+0.06*k;
    }
    else if(t < T.flyEnd-0.05){ fOp=0; fSc=1.12; } // gone while roaming
    else if(t < T.lock){                    // closes in & locks
      const k=smoothRange(t, T.flyEnd-0.05, T.lock);
      fOp=k;
      fSc=lerp(1.12, 1.0, smooth(k));
    }
    else {                                   // settled, tiny lock overshoot already done
      fOp=1; fSc=1;
    }
    frame.style.opacity=fOp.toFixed(3);
    frame.style.transform=`scale(${fSc.toFixed(4)})`;

    // ----- closing ring: contracts in, then flashes as it locks -----
    let rOp=0, rSc=1.0, rGlow=0;
    if(t>=T.flyEnd && t<8.95){
      const k=smoothRange(t, T.flyEnd, T.lock);            // contract 0..1
      rSc=lerp(1.28, 1.0, k);
      const appear=smoothRange(t, T.flyEnd, T.flyEnd+0.55);
      const fade=smoothRange(t, T.lock+0.06, 8.95);
      rOp=appear*(1-fade)*0.95;
      const sd=Math.max(0, 1-Math.abs((t-T.lock)/0.16)); // snap flash at lock
      rGlow=sd*30;
    }
    lockring.style.opacity=rOp.toFixed(3);
    lockring.style.transform=`scale(${rSc.toFixed(4)})`;
    lockring.style.boxShadow = rGlow>0.5 ? `0 0 ${rGlow}px ${rGlow*0.55}px rgba(242,100,26,.6)` : 'none';

    // ----- glow bloom (the pulse) -----
    let gOp=0, gSc=0.5;
    if(t>=T.lock-0.05 && t<T.pulse+0.15){
      const k=clamp((t-(T.lock-0.05))/((T.pulse+0.15)-(T.lock-0.05)),0,1);
      gOp = Math.sin(k*Math.PI)*0.8;
      gSc = lerp(0.55, 1.5, k);
    }
    glow.style.opacity=gOp.toFixed(3);
    glow.style.transform=`scale(${gSc.toFixed(3)})`;

    // keep going for idle shimmer
    if(!paused) raf=requestAnimationFrame(loop);
  }

  /* ---------- controls ---------- */
  document.getElementById('replay').addEventListener('click', reset);

  const viewport=document.querySelector('.viewport');
  const bgseg=document.getElementById('bgseg');
  bgseg.addEventListener('click', e=>{
    const b=e.target.closest('button[data-bg]'); if(!b) return;
    viewport.setAttribute('data-bg', b.dataset.bg);
    [...bgseg.children].forEach(c=>c.setAttribute('aria-pressed', c===b ? 'true':'false'));
  });

  // start once images are ready (so first frame is aligned)
  Promise.all([...document.querySelectorAll('.scene img')].map(img=>
    img.complete ? Promise.resolve() : new Promise(r=>{img.onload=r; img.onerror=r;})
  )).then(reset);
})();
</script>
</body>
</html>
