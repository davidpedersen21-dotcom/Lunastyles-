<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sand:#f5ede0; --clay:#c9946a; --rust:#b5522a; --bark:#3d2b1f;
      --sage:#7a8c6e; --cream:#fdf8f2; --gold:#c8a96e; --text:#2e1f14;
    }
    html { scroll-behavior: smooth; }
    body { font-family:'Jost',sans-serif; background:var(--cream); color:var(--text); overflow-x:hidden; }
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:.022;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size:150px;
    }
    a { color: inherit; }

    /* ── HEADER (shared) ── */
    .site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: .9rem 2.5rem;
      background: rgba(253,248,242,.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(201,148,106,.2);
      transition: top .3s;
    }
    .site-header .logo img { height: 50px; width: auto; display: block; }
    .site-nav { display: flex; gap: 1.75rem; align-items: center; }
    .site-nav a {
      font-size: .78rem; font-weight: 500; letter-spacing: .1em;
      text-transform: uppercase; text-decoration: none; color: var(--bark);
      opacity: .68; transition: opacity .2s, color .2s;
    }
    .site-nav a:hover { opacity: 1; color: var(--rust); }
    .site-nav a.nav-cta {
      background: var(--rust); color: #fff !important; opacity: 1 !important;
      padding: .5rem 1.15rem; border-radius: 2px; transition: background .2s !important;
    }
    .site-nav a.nav-cta:hover { background: var(--bark) !important; }
    .nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: .25rem; }
    .nav-toggle svg { width: 26px; height: 26px; stroke: var(--bark); }

    /* ── BUTTONS (shared) ── */
    .btn {
      display: inline-flex; align-items: center; gap: .55rem;
      padding: .8rem 1.6rem; border-radius: 2px;
      font-size: .78rem; font-weight: 500; letter-spacing: .1em;
      text-transform: uppercase; text-decoration: none; cursor: pointer;
      transition: transform .2s, box-shadow .2s, background .2s, border-color .2s;
      border: none; font-family: inherit;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
    .btn-primary { background: var(--rust); color: #fff; }
    .btn-primary:hover { background: var(--bark); }
    .btn-outline { border: 1.5px solid var(--clay); color: var(--bark); background: transparent; }
    .btn-outline:hover { background: var(--sand); }
    .btn-light { border: 1.5px solid rgba(255,255,255,.3); color: #fff; background: transparent; }
    .btn-light:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.6); }
    .icon { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

    .section-label {
      font-size: .7rem; font-weight: 600; letter-spacing: .22em;
      text-transform: uppercase; color: var(--clay); margin-bottom: 1rem;
    }

    /* ── FOOTER (shared) ── */
    .site-footer {
      background: #2a1a0f; color: rgba(255,255,255,.5);
      padding: 3rem 2.5rem 2rem;
    }
    .footer-top {
      display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 2.5rem;
      max-width: 1100px; margin: 0 auto 2.5rem; align-items: start;
    }
    .footer-brand img { height: 64px; margin-bottom: 1rem; opacity: .95; }
    .footer-brand p {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 1.02rem; line-height: 1.7; color: rgba(255,255,255,.45); max-width: 38ch;
    }
    .footer-col h4 {
      font-size: .72rem; font-weight: 600; letter-spacing: .15em;
      text-transform: uppercase; color: var(--gold); margin-bottom: 1.1rem;
    }
    .footer-col a {
      display: block; text-decoration: none; color: rgba(255,255,255,.55);
      font-size: .85rem; margin-bottom: .7rem; transition: color .2s;
    }
    .footer-col a:hover { color: #fff; }
    .footer-bottom {
      max-width: 1100px; margin: 0 auto; padding-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,.1);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem; font-size: .74rem;
    }
    .footer-socials { display: flex; gap: .9rem; }
    .footer-socials a {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .footer-socials a:hover { background: var(--rust); }
    .footer-socials svg { width: 15px; height: 15px; }

    /* ── DM FLOAT (shared) ── */
    #dm-float { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 500;
      display: flex; flex-direction: column; align-items: flex-end; gap: .6rem; }
    .dm-options { display: flex; flex-direction: column; align-items: flex-end; gap: .5rem;
      opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .25s, transform .25s; }
    #dm-float.open .dm-options { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .dm-option { display: flex; align-items: center; gap: .6rem; text-decoration: none; color: #fff;
      padding: .6rem 1rem; border-radius: 50px; font-size: .78rem; font-weight: 500; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,.22); transition: transform .2s; }
    .dm-option:hover { transform: translateX(-4px); }
    .dm-option svg { width: 18px; height: 18px; flex-shrink: 0; }
    .dm-option.ig { background: linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045); }
    .dm-option.wn { background: #5b4de0; }
    .dm-option.et { background: #f56400; }
    .dm-fab { width: 56px; height: 56px; border-radius: 50%; background: var(--rust); border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(181,82,42,.45); transition: background .2s, transform .2s; color: #fff; }
    .dm-fab:hover { background: var(--bark); transform: scale(1.08); }
    .dm-fab svg { width: 24px; height: 24px; transition: transform .3s; }
    #dm-float.open .dm-fab { background: var(--bark); }
    #dm-float.open .dm-fab svg { transform: rotate(45deg); }

    @media (max-width: 860px) {
      .site-header { padding: .8rem 1.25rem; }
      .nav-toggle { display: block; }
      .site-nav {
        position: fixed; top: 0; right: 0; bottom: 0; width: 75%; max-width: 320px;
        background: var(--cream); flex-direction: column; align-items: flex-start;
        padding: 5rem 2rem 2rem; gap: 1.5rem; transform: translateX(100%);
        transition: transform .3s; box-shadow: -8px 0 30px rgba(0,0,0,.15); z-index: 110;
      }
      .site-nav.open { transform: translateX(0); }
      .site-nav a { font-size: .9rem; }
      .nav-close { position: absolute; top: 1.25rem; right: 1.5rem; background: none; border: none; cursor: pointer; }
      .nav-close svg { width: 24px; height: 24px; stroke: var(--bark); }
      .footer-top { grid-template-columns: 1fr; gap: 2rem; text-align: center; }
      .footer-brand img { margin: 0 auto 1rem; }
      .footer-brand p { margin: 0 auto; }
      .footer-bottom { flex-direction: column; text-align: center; }
    }

    .ty-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: var(--cream); }
    .ty-card { max-width: 480px; width: 100%; background: #fff; border-radius: 8px; padding: 3.5rem 3rem; box-shadow: 0 8px 40px rgba(61,43,31,.1); text-align: center; }
    .ty-card .logo-img { height: 80px; margin-bottom: 1.5rem; }
    .ty-icon { width: 3rem; height: 3rem; display: block; margin: 0 auto 1.25rem; color: var(--rust); }
    .ty-card h1 { font-family:'Playfair Display',serif; font-size: 2rem; font-weight: 600; color: var(--bark); margin-bottom: .75rem; line-height: 1.2; }
    .ty-card h1 em { font-style: normal; color: var(--rust); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
    .ty-card p { font-family:'Cormorant Garamond',serif; font-size: 1.1rem; font-style: italic; line-height: 1.75; color: var(--bark); opacity: .75; margin-bottom: 2rem; }
    .ty-divider { border: none; border-top: 1px solid rgba(61,43,31,.1); margin: 2rem 0 1.5rem; }
    .ty-also { font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--clay); margin-bottom: 1rem; }
    .ty-btns { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; }
</style>
</head>
