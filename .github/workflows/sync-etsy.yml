name: Apply Etsy Sync Data

on:
  push:
    paths:
      - 'data/etsy-sync.json'   # fires when bookmarklet pushes new data
  workflow_dispatch:             # manual trigger from Actions tab

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply Etsy data to index.html
        run: node scripts/apply-etsy-data.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to index.html"
          else
            git add index.html
            git commit -m "chore: apply Etsy sync — $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
