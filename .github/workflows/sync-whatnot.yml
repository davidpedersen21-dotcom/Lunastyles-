name: Apply Whatnot Sync Data
on:
  push:
    paths:
      - 'data/whatnot-sync.json'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/apply-whatnot-data.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: apply Whatnot sync — $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push
